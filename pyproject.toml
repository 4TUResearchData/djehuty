[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel"
]
build-backend   = "setuptools.build_meta"

[project]
name            = "djehuty"
version         = "26.5"
authors         = [{ name="Roel Janssen", email="r.r.e.janssen@tudelft.nl" }]
description     = "The 4TU.ResearchData and Nikhef data repository system"
readme          = "README.md"
requires-python = ">=3.10"
dependencies    = [
    "boto3",
    "Jinja2>=3.0.3",
    "pygit2>=1.6.1",
    "rdflib>=6.0.0",
    "requests>=2.26.0",
    "Werkzeug>=2.0.2",
    "defusedxml>=0.7.1",
    "pillow>=9.4.0",
]
classifiers     = [
    "Programming Language :: Python :: 3",
    "Environment :: Web Environment",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage"      = "https://data.4tu.nl/"
"Source Code"   = "https://github.com/4TUResearchData/djehuty"
"Bug Tracker"   = "https://github.com/4TUResearchData/djehuty/issues"

[project.scripts]
djehuty = "djehuty.ui:main"

# Ship all bundled resources
[tool.setuptools.package-data]
"djehuty.web"    = ["resources/**"]
"djehuty.backup" = ["resources/**"]
"djehuty.schema" = ["migrations/**"]

[dependency-groups]
docs = [
    "mkdocs-material",
    "mkdocs-include-markdown-plugin",
]
dev = [
    "coverage[toml]>=7.0",
    "Faker>=37.12.0",
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-playwright>=0.4.4",
    "pytest-rerunfailures>=14.0",
    "python-slugify>=8.0.0",
]

lint = [
    "ruff>=0.15.21",
]

[tool.coverage.run]
source = ["djehuty"]
branch = true
parallel = true

[tool.coverage.paths]
source = [
    "src/djehuty",
    "/app/src/djehuty",
    "*/site-packages/djehuty",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
omit = [
    "src/djehuty/backup/*",
]

[tool.coverage.html]
directory = "coverage-html"

[tool.ruff]
line-length = 100
# Paths already cleaned and enforced by ruff (extended per sub-issue).
# `ruff check`/`ruff format` with no path args operate on these.
include = [
    "src/djehuty/utils/**/*.py",
    "src/djehuty/web/config/**/*.py",
    "src/djehuty/web/locks.py",
    "src/djehuty/web/email_handler.py",
    "src/djehuty/ui.py",
    "src/djehuty/__init__.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "B"
]

