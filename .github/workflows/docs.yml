name: Docs


# Builds the MkDocs documentation, the static API reference and the Quarto
# community site, then publishes all three to the gh-pages branch, which
# GitHub Pages serves.

# The generated sections are written into docs/ before mkdocs runs, so
# mkdocs copies them into site/ and resolves their nav links relative to each
# page. When the ontology docs exist, generate them the same way, so the whole
# site is assembled and published in one go!!


on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'uv.lock'
      # The API reference is generated from the route definitions, so it
      # goes stale when an endpoint changes, not only when docs/ changes
      - 'src/djehuty/api/**'
      - 'src/djehuty/application.py'
      # The community site is rendered from its Quarto sources
      - 'community/**'
      - 'justfile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0

      # Must run before docs-md: mkdocs copies docs/api/ into the site
      - name: Build API reference
        run: |
          just openapi

      # Must run before docs-md: mkdocs copies docs/community/ into the site
      - name: Build community site
        run: just docs-community

      - name: Build Markdown documentation
        run: just docs-md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # Re-write the custom-domain file on every deploy. The publish dir is
          # force-pushed to gh-pages, so without this each deploy deletes CNAME
          # and GitHub drops the djehuty.4tu.nl mapping (the site 404s).
          cname: djehuty.4tu.nl
