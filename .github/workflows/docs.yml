name: Docs


# Builds the MkDocs documentation and the static API reference, then
# publishes both to the gh-pages branch, which GitHub Pages serves.

# The API reference is generated into docs/api/ *before* mkdocs runs, so
# mkdocs copies it into site/api/ and resolves the nav link to it relative
# to each page. When the ontology docs exist, generate them the same way,
# so the whole site is assembled and published atomically in one go.


on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'uv.lock'
      # The API reference is generated from the route definitions, so it
      # goes stale when an endpoint changes, not only when docs/ changes
      - 'src/djehuty/api/**'
      - 'src/djehuty/application.py'
      - 'justfile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4

      # Must run before docs-md: mkdocs copies docs/api/ into the site
      - name: Build API reference
        run: |
          just openapi

      - name: Build Markdown documentation
        run: just docs-md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
